name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: skia
    strategy:
      fail-fast: false
      matrix:
        mode: [Release, Debug]

    steps:
    - uses: actions/checkout@v4

    - name: Clone Skia Repository
      shell: bash
      working-directory: .
      run: |
        git clone --depth 1 https://skia.googlesource.com/skia.git

    - name: Cache Skia Dependencies
      uses: actions/cache@v4
      with:
        path: skia/third_party/externals
        key: ${{ runner.os }}-skia-deps-${{ hashFiles('skia/DEPS') }}
        restore-keys: |
          ${{ runner.os }}-skia-deps-

    - name: Sync Deps
      shell: bash
      env:
        GIT_SYNC_DEPS_SKIP_EMSDK: true
      run: python tools/git-sync-deps

    - name: Fetch GN
      shell: bash
      run: |
        python bin/fetch-gn

    - name: Install LLVM and Clang 20
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: "20.1"

    - name: Generating Ninja Files
      shell: bash
      run: |
        if [[ "${{ matrix.mode }}" == "Debug" ]] ; then
          export is_debug=true
          export is_official=false
          export runtime_lib="static_dbg"
        else
          export is_debug=false
          export is_official=true
          export runtime_lib="static"
        fi
        
        clang++ --version
        
        export gn_flags='is_trivial_abi=false win_vc="C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC" win_toolchain_version="17.10" win_sdk="C:/Program Files/Windows Kits/10" win_sdk_version="10.0.22621.0" cc="clang" cxx="clang++" clang_win="C:/Program Files/LLVM" clang_win_version="20.1"'
        export gn_flags="$gn_flags extra_cflags=[\"-fms-runtime-lib=$runtime_lib\"]"
        
        bin/gn.exe gen out/${{ matrix.mode }}-x64 --args="is_debug=$is_debug is_official_build=$is_official skia_use_system_expat=false skia_use_system_icu=false skia_use_system_libjpeg_turbo=false skia_use_system_libpng=false skia_use_system_libwebp=false skia_use_system_zlib=false skia_use_freetype=true skia_use_harfbuzz=true skia_pdf_subset_harfbuzz=true skia_use_system_freetype2=false skia_use_system_harfbuzz=false target_cpu=\"x64\" $gn_flags"

    - name: Compiling
      shell: bash
      run: |
        ninja -C out/${{ matrix.mode }}-x64 skia modules

    - name: Copying Files
      shell: bash
      run: |
        dst=Skia-Windows-${{ matrix.mode }}-x64
        mkdir -p $dst
        cp -R --parents \
          out/${{ matrix.mode }}-x64/args.gn \
          out/${{ matrix.mode }}-x64/*.lib \
          LICENSE \
          include \
          modules/skcms/*.h \
          modules/skcms/src/*.h \
          modules/skottie/include/*.h \
          modules/skparagraph/include/*.h \
          modules/skplaintexteditor/include/*.h \
          modules/skresources/include/*.h \
          modules/sksg/include/*.h \
          modules/skshaper/include/*.h \
          modules/skunicode/include/*.h \
          modules/svg/include/*.h \
          src/codec/*.h \
          src/core/*.h \
          src/effects/*.h \
          src/effects/colorfilters/*.h \
          src/encode/*.h \
          src/gpu/*.h \
          src/gpu/ganesh/*.h \
          src/gpu/ganesh/d3d/*.h \
          src/gpu/ganesh/effects/*.h \
          src/gpu/ganesh/geometry/*.h \
          src/gpu/ganesh/gl/*.h \
          src/gpu/ganesh/gl/builders/*.h \
          src/gpu/ganesh/glsl/*.h \
          src/gpu/ganesh/gradients/*.h \
          src/gpu/ganesh/image/*.h \
          src/gpu/ganesh/mock/*.h \
          src/gpu/ganesh/mtl/*.h \
          src/gpu/ganesh/ops/*.h \
          src/gpu/ganesh/surface/*.h \
          src/gpu/ganesh/tessellate/*.h \
          src/gpu/ganesh/text/*.h \
          src/gpu/ganesh/vk/*.h \
          src/gpu/graphite/*.h \
          src/gpu/graphite/compute/*.h \
          src/gpu/graphite/dawn/*.h \
          src/gpu/graphite/geom/*.h \
          src/gpu/graphite/mtl/*.h \
          src/gpu/graphite/render/*.h \
          src/gpu/graphite/text/*.h \
          src/gpu/graphite/vk/*.h \
          src/gpu/mtl/*.h \
          src/gpu/tessellate/*.h \
          src/gpu/vk/*.h \
          src/gpu/vk/vulkanmemoryallocator/*.h \
          src/image/*.h \
          src/lazy/*.h \
          src/opts/*.h \
          src/pathops/*.h \
          src/pdf/*.h \
          src/ports/*.h \
          src/sfnt/*.h \
          src/shaders/*.h \
          src/shaders/gradients/*.h \
          src/sksl/*.h \
          src/sksl/analysis/*.h \
          src/sksl/codegen/*.h \
          src/sksl/ir/*.h \
          src/sksl/lex/*.h \
          src/sksl/tracing/*.h \
          src/sksl/transform/*.h \
          src/svg/*.h \
          src/text/*.h \
          src/text/gpu/*.h \
          src/utils/*.h \
          src/utils/mac/*.h \
          src/utils/win/*.h \
          src/xml/*.h \
          src/xps/*.h \
          third_party/externals/angle2/LICENSE \
          third_party/externals/angle2/include \
          third_party/externals/freetype/LICENSE.TXT \
          third_party/externals/freetype/docs/FTL.TXT \
          third_party/externals/freetype/docs/GPLv2.TXT \
          third_party/externals/freetype/include \
          third_party/externals/harfbuzz/COPYING \
          third_party/externals/harfbuzz/src/*.h \
          third_party/externals/icu/LICENSE \
          third_party/externals/icu/flutter/icudtl.dat \
          third_party/externals/libjpeg-turbo/LICENSE.md \
          third_party/externals/libjpeg-turbo/src/*.h \
          out/${{ matrix.mode }}-x64/gen/third_party/externals/libjpeg-turbo/*.h \
          third_party/externals/libpng/*.h \
          third_party/externals/libpng/LICENSE \
          third_party/externals/libwebp/COPYING \
          third_party/externals/libwebp/PATENTS \
          third_party/externals/libwebp/src/dec/*.h \
          third_party/externals/libwebp/src/dsp/*.h \
          third_party/externals/libwebp/src/enc/*.h \
          third_party/externals/libwebp/src/mux/*.h \
          third_party/externals/libwebp/src/utils/*.h \
          third_party/externals/libwebp/src/webp/*.h \
          third_party/externals/swiftshader/LICENSE.txt \
          third_party/externals/swiftshader/include \
          third_party/externals/zlib/*.h \
          third_party/externals/zlib/LICENSE \
          $dst || true

    - name: Uploading Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Skia-Windows-${{ matrix.mode }}-x64
        path: skia/Skia-Windows-${{ matrix.mode }}-x64
        retention-days: 3
